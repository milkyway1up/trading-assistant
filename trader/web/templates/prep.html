{% extends "base.html" %}
{% block title %}Prep · Trading Assistant{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col">
  <header class="border-b border-slate-800 px-4 py-2 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h1 class="text-lg font-bold text-cyan-400">Trading Assistant</h1>
      <nav class="flex gap-3 text-xs text-slate-400">
        <a href="/" class="hover:text-cyan-400">Dashboard</a>
        <a href="/journal" class="hover:text-cyan-400">Journal</a>
        <a href="/prep" class="hover:text-cyan-400 text-cyan-400">Prep</a>
        <a href="/backtest" class="hover:text-cyan-400">Backtest</a>
      </nav>
    </div>
    <button id="prep-generate" class="px-3 py-1 rounded bg-cyan-700 hover:bg-cyan-600 text-sm font-bold">
      Generate weekly prep
    </button>
  </header>

  <main class="flex-1 flex overflow-hidden">
    <aside class="w-56 border-r border-slate-800 overflow-y-auto">
      <div class="px-3 py-2 text-xs uppercase text-slate-500 border-b border-slate-800">Saved prep docs</div>
      <ul id="prep-list" class="text-sm">
        <li class="px-3 py-2 text-slate-500">loading…</li>
      </ul>
    </aside>
    <section class="flex-1 overflow-y-auto p-6">
      <div id="prep-status" class="text-xs text-slate-500 mb-2"></div>
      <article id="prep-content" class="prose prose-invert max-w-3xl">
        <div class="text-slate-500">Select a doc on the left, or generate a new one.</div>
      </article>
    </section>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/js/prep.js"></script>
<script>initPrep();</script>
{% endblock %}
