{% extends "base.html" %}
{% block title %}Backtest · Trading Assistant{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col">
  <header class="border-b border-slate-800 px-4 py-2 flex items-center justify-between">
    <h1 class="text-lg font-bold text-cyan-400">Trading Assistant</h1>
    <nav class="flex gap-3 text-xs text-slate-400">
      <a href="/" class="hover:text-cyan-400">Dashboard</a>
      <a href="/journal" class="hover:text-cyan-400">Journal</a>
      <a href="/prep" class="hover:text-cyan-400">Prep</a>
      <a href="/backtest" class="hover:text-cyan-400 text-cyan-400">Backtest</a>
    </nav>
  </header>

  <main class="flex-1 p-4 grid grid-cols-12 gap-4">
    <section class="col-span-3 bg-slate-800/30 border border-slate-700 rounded p-4 space-y-3 h-fit">
      <h2 class="text-sm font-bold uppercase text-slate-400">Configure</h2>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Strategy</label>
        <select id="bt-strategy" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm">
          <option>loading…</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Ticker</label>
        <input id="bt-ticker" value="SPY" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm uppercase" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Period</label>
        <select id="bt-period" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm">
          <option value="1y">1y</option>
          <option value="2y">2y</option>
          <option value="5y" selected>5y</option>
          <option value="10y">10y</option>
          <option value="max">max</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Initial cash</label>
        <input id="bt-cash" type="number" value="10000" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
      </div>
      <button id="bt-run" class="w-full px-3 py-2 rounded bg-cyan-700 hover:bg-cyan-600 text-sm font-bold">Run backtest</button>
      <div id="bt-status" class="text-xs text-slate-500"></div>
    </section>

    <section class="col-span-9 bg-slate-800/30 border border-slate-700 rounded p-4">
      <h2 class="text-sm font-bold uppercase text-slate-400 mb-3">Results</h2>
      <div id="bt-results" class="text-sm text-slate-500">Configure and run a backtest to see results.</div>
    </section>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/backtest.js"></script>
<script>initBacktest();</script>
{% endblock %}
